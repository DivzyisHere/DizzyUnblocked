<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Flappy Sky</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #0f172a;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 12px;
    }
    #wrap {
      position: relative;
      width: 100%;
      max-width: 360px;
      aspect-ratio: 9 / 14;
      border-radius: 12px;
      overflow: hidden;
      border: 2px solid #334155;
      background: #38bdf8;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    canvas { width: 100%; height: 100%; display: block; }
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.85);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      z-index: 10;
    }
    .overlay.active { display: flex; }
    .overlay h2 { font-size: 28px; color: #f59e0b; }
    .overlay p { font-size: 14px; color: #94a3b8; }
    button.btn {
      background: #f59e0b;
      color: #0f172a;
      border: none;
      font-weight: 700;
      font-size: 14px;
      padding: 10px 24px;
      border-radius: 8px;
      cursor: pointer;
    }
    button.btn:hover { background: #d97706; }
    .hint {
      margin-top: 10px;
      font-size: 12px;
      color: #64748b;
    }
  </style>
</head>
<body>
  <div id="wrap">
    <canvas id="c" width="360" height="560"></canvas>
    <div class="overlay active" id="menu">
      <h2 id="menu-title">Flappy Sky</h2>
      <p id="menu-sub">Tap, Click or Spacebar to Flap</p>
      <button class="btn" id="start-btn">Start Flight</button>
    </div>
  </div>
  <div class="hint">Press Space or Tap Screen to Flap</div>

  <script>
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    const menu = document.getElementById('menu');
    const menuTitle = document.getElementById('menu-title');
    const menuSub = document.getElementById('menu-sub');
    const startBtn = document.getElementById('start-btn');

    let bird = { x: 80, y: 240, vy: 0, radius: 14 };
    let pipes = [];
    let score = 0;
    let best = parseInt(localStorage.getItem('flappy_best') || '0', 10);
    let state = 'MENU'; // 'MENU' | 'PLAYING' | 'OVER'
    let frame = 0;

    const GRAVITY = 0.38;
    const JUMP = -6.8;
    const PIPE_SPEED = 2.4;
    const PIPE_GAP = 135;
    const PIPE_WIDTH = 54;

    function reset() {
      bird = { x: 80, y: 240, vy: 0, radius: 14 };
      pipes = [];
      score = 0;
      frame = 0;
      state = 'PLAYING';
      menu.classList.remove('active');
    }

    function flap() {
      if (state === 'MENU' || state === 'OVER') {
        reset();
      } else if (state === 'PLAYING') {
        bird.vy = JUMP;
      }
    }

    function spawnPipe() {
      const topHeight = Math.floor(Math.random() * (canvas.height - PIPE_GAP - 160)) + 60;
      pipes.push({
        x: canvas.width,
        top: topHeight,
        bottom: topHeight + PIPE_GAP,
        passed: false
      });
    }

    function loop() {
      frame++;

      if (state === 'PLAYING') {
        bird.vy += GRAVITY;
        bird.y += bird.vy;

        // Pipe spawn
        if (frame % 95 === 0) {
          spawnPipe();
        }

        // Move pipes
        for (let i = 0; i < pipes.length; i++) {
          const p = pipes[i];
          p.x -= PIPE_SPEED;

          if (!p.passed && p.x + PIPE_WIDTH < bird.x) {
            p.passed = true;
            score++;
            if (score > best) {
              best = score;
              localStorage.setItem('flappy_best', best);
            }
          }

          // Collision detection
          if (bird.x + bird.radius > p.x && bird.x - bird.radius < p.x + PIPE_WIDTH) {
            if (bird.y - bird.radius < p.top || bird.y + bird.radius > p.bottom) {
              gameOver();
            }
          }
        }

        // Clean pipes
        pipes = pipes.filter(p => p.x + PIPE_WIDTH > -10);

        // Ground / ceiling collision
        if (bird.y + bird.radius >= canvas.height - 40 || bird.y - bird.radius <= 0) {
          gameOver();
        }
      }

      draw();
      requestAnimationFrame(loop);
    }

    function gameOver() {
      state = 'OVER';
      menuTitle.textContent = "Game Over";
      menuSub.textContent = `Score: ${score} · Best: ${best}`;
      startBtn.textContent = "Play Again";
      menu.classList.add('active');
    }

    function draw() {
      // Sky gradient
      const sky = ctx.createLinearGradient(0, 0, 0, canvas.height);
      sky.addColorStop(0, '#0284c7');
      sky.addColorStop(0.7, '#38bdf8');
      sky.addColorStop(1, '#7dd3fc');
      ctx.fillStyle = sky;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Clouds
      ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
      ctx.beginPath();
      ctx.arc(100, 100, 30, 0, Math.PI * 2);
      ctx.arc(140, 90, 40, 0, Math.PI * 2);
      ctx.arc(180, 100, 30, 0, Math.PI * 2);
      ctx.fill();

      // Pipes
      pipes.forEach(p => {
        // Top pipe
        ctx.fillStyle = '#15803d';
        ctx.fillRect(p.x, 0, PIPE_WIDTH, p.top);
        ctx.fillStyle = '#16a34a';
        ctx.fillRect(p.x + 3, 0, 8, p.top);
        ctx.fillRect(p.x - 4, p.top - 20, PIPE_WIDTH + 8, 20);

        // Bottom pipe
        ctx.fillStyle = '#15803d';
        ctx.fillRect(p.x, p.bottom, PIPE_WIDTH, canvas.height - p.bottom);
        ctx.fillStyle = '#16a34a';
        ctx.fillRect(p.x + 3, p.bottom, 8, canvas.height - p.bottom);
        ctx.fillRect(p.x - 4, p.bottom, PIPE_WIDTH + 8, 20);
      });

      // Ground
      ctx.fillStyle = '#78350f';
      ctx.fillRect(0, canvas.height - 40, canvas.width, 40);
      ctx.fillStyle = '#22c55e';
      ctx.fillRect(0, canvas.height - 40, canvas.width, 10);

      // Bird
      ctx.save();
      ctx.translate(bird.x, bird.y);
      let angle = Math.min(Math.PI / 4, Math.max(-Math.PI / 4, bird.vy * 0.08));
      ctx.rotate(angle);

      // Body
      ctx.fillStyle = '#facc15';
      ctx.beginPath();
      ctx.arc(0, 0, bird.radius, 0, Math.PI * 2);
      ctx.fill();

      // Wing
      ctx.fillStyle = '#f59e0b';
      ctx.beginPath();
      ctx.ellipse(-4, 2, 7, 5, 0, 0, Math.PI * 2);
      ctx.fill();

      // Eye
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(6, -4, 4, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#0f172a';
      ctx.beginPath();
      ctx.arc(7, -4, 2, 0, Math.PI * 2);
      ctx.fill();

      // Beak
      ctx.fillStyle = '#ea580c';
      ctx.beginPath();
      ctx.moveTo(10, 0);
      ctx.lineTo(18, 2);
      ctx.lineTo(10, 6);
      ctx.closePath();
      ctx.fill();

      ctx.restore();

      // Score HUD
      if (state === 'PLAYING') {
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 36px -apple-system, BlinkMacSystemFont, sans-serif';
        ctx.textAlign = 'center';
        ctx.shadowColor = 'rgba(0,0,0,0.4)';
        ctx.shadowBlur = 6;
        ctx.fillText(score, canvas.width / 2, 70);
        ctx.shadowBlur = 0;
      }
    }

    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space' || e.code === 'ArrowUp') {
        e.preventDefault();
        flap();
      }
    });

    canvas.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      flap();
    });

    startBtn.addEventListener('click', () => {
      reset();
    });

    requestAnimationFrame(loop);
  </script>
</body>
</html>
