<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Minesweeper Deluxe</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 12px;
    }
    .game-card {
      background: #1e293b;
      border: 2px solid #334155;
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .hud {
      width: 100%;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 8px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }
    .counter {
      font-family: 'Courier New', Courier, monospace;
      font-size: 22px;
      font-weight: 800;
      color: #ef4444;
      background: #000;
      padding: 2px 8px;
      border-radius: 4px;
      min-width: 54px;
      text-align: center;
    }
    .face-btn {
      background: #334155;
      border: 1px solid #475569;
      font-size: 22px;
      width: 40px;
      height: 40px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .face-btn:hover { background: #475569; }
    #board {
      display: grid;
      gap: 3px;
      background: #0f172a;
      padding: 6px;
      border-radius: 8px;
      border: 1px solid #334155;
    }
    .tile {
      width: 32px;
      height: 32px;
      background: #334155;
      border: 1px solid #475569;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 14px;
      cursor: pointer;
      transition: background 0.1s;
    }
    .tile:hover:not(.revealed) { background: #475569; }
    .tile.revealed {
      background: #1e293b;
      border-color: #334155;
      cursor: default;
    }
    .tile.flagged { color: #f59e0b; }
    .tile.mine { background: #dc2626 !important; }
    .c-1 { color: #38bdf8; }
    .c-2 { color: #4ade80; }
    .c-3 { color: #f87171; }
    .c-4 { color: #818cf8; }
    .c-5 { color: #fb923c; }
    .c-6 { color: #2dd4bf; }
    .hint {
      margin-top: 12px;
      font-size: 11px;
      color: #64748b;
      text-align: center;
    }
    .mode-toggle {
      margin-top: 8px;
      display: flex;
      gap: 6px;
    }
    .mode-btn {
      background: transparent;
      border: 1px solid #475569;
      color: #94a3b8;
      font-size: 11px;
      padding: 4px 8px;
      border-radius: 4px;
      cursor: pointer;
    }
    .mode-btn.active { background: #38bdf8; color: #0f172a; font-weight: bold; }
  </style>
</head>
<body>
  <div class="game-card">
    <div class="hud">
      <div class="counter" id="mines-count">010</div>
      <button class="face-btn" id="face">🙂</button>
      <div class="counter" id="timer">000</div>
    </div>

    <div id="board"></div>

    <div class="mode-toggle">
      <button class="mode-btn active" id="btn-easy">9x9 (10 Mines)</button>
      <button class="mode-btn" id="btn-med">12x12 (20 Mines)</button>
    </div>
  </div>
  <div class="hint">Left-click: reveal · Right-click (or long tap): place flag 🚩</div>

  <script>
    let ROWS = 9;
    let COLS = 9;
    let MINES = 10;

    let grid = [];
    let revealedCount = 0;
    let flagsCount = 0;
    let isGameOver = false;
    let firstClick = true;
    let timerInterval = null;
    let seconds = 0;

    const boardEl = document.getElementById('board');
    const faceBtn = document.getElementById('face');
    const minesCountEl = document.getElementById('mines-count');
    const timerEl = document.getElementById('timer');
    const btnEasy = document.getElementById('btn-easy');
    const btnMed = document.getElementById('btn-med');

    btnEasy.addEventListener('click', () => {
      ROWS = 9; COLS = 9; MINES = 10;
      btnEasy.classList.add('active');
      btnMed.classList.remove('active');
      initGame();
    });

    btnMed.addEventListener('click', () => {
      ROWS = 12; COLS = 12; MINES = 20;
      btnMed.classList.add('active');
      btnEasy.classList.remove('active');
      initGame();
    });

    function initGame() {
      clearInterval(timerInterval);
      seconds = 0;
      timerEl.textContent = '000';
      revealedCount = 0;
      flagsCount = 0;
      isGameOver = false;
      firstClick = true;
      faceBtn.textContent = '🙂';
      updateMineDisplay();

      grid = [];
      boardEl.innerHTML = '';
      boardEl.style.gridTemplateColumns = `repeat(${COLS}, 32px)`;

      for (let r = 0; r < ROWS; r++) {
        grid[r] = [];
        for (let c = 0; c < COLS; c++) {
          const tileEl = document.createElement('div');
          tileEl.className = 'tile';
          tileEl.dataset.r = r;
          tileEl.dataset.c = c;

          tileEl.addEventListener('click', () => handleClick(r, c));
          tileEl.addEventListener('contextmenu', (e) => {
            e.preventDefault();
            handleRightClick(r, c);
          });

          // Long press support for mobile touch
          let pressTimer;
          tileEl.addEventListener('touchstart', (e) => {
            pressTimer = setTimeout(() => {
              handleRightClick(r, c);
            }, 400);
          }, { passive: true });
          tileEl.addEventListener('touchend', () => clearTimeout(pressTimer));

          boardEl.appendChild(tileEl);

          grid[r][c] = {
            mine: false,
            revealed: false,
            flagged: false,
            adjacent: 0,
            el: tileEl
          };
        }
      }
    }

    function plantMines(safeR, safeC) {
      let planted = 0;
      while (planted < MINES) {
        const r = Math.floor(Math.random() * ROWS);
        const c = Math.floor(Math.random() * COLS);
        // Avoid initial click and adjacent
        if ((Math.abs(r - safeR) <= 1 && Math.abs(c - safeC) <= 1) || grid[r][c].mine) {
          continue;
        }
        grid[r][c].mine = true;
        planted++;
      }

      // Calculate adjacent numbers
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          if (!grid[r][c].mine) {
            let count = 0;
            for (let dr = -1; dr <= 1; dr++) {
              for (let dc = -1; dc <= 1; dc++) {
                const nr = r + dr, nc = c + dc;
                if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS && grid[nr][nc].mine) {
                  count++;
                }
              }
            }
            grid[r][c].adjacent = count;
          }
        }
      }
    }

    function startTimer() {
      timerInterval = setInterval(() => {
        seconds = Math.min(999, seconds + 1);
        timerEl.textContent = String(seconds).padStart(3, '0');
      }, 1000);
    }

    function updateMineDisplay() {
      const remaining = MINES - flagsCount;
      minesCountEl.textContent = String(Math.max(-99, remaining)).padStart(3, '0');
    }

    function handleClick(r, c) {
      if (isGameOver) return;
      const cell = grid[r][c];
      if (cell.revealed || cell.flagged) return;

      if (firstClick) {
        firstClick = false;
        plantMines(r, c);
        startTimer();
      }

      revealCell(r, c);

      if (cell.mine) {
        gameOver(false);
      } else if (revealedCount === ROWS * COLS - MINES) {
        gameOver(true);
      }
    }

    function handleRightClick(r, c) {
      if (isGameOver) return;
      const cell = grid[r][c];
      if (cell.revealed) return;

      cell.flagged = !cell.flagged;
      if (cell.flagged) {
        flagsCount++;
        cell.el.textContent = '🚩';
        cell.el.classList.add('flagged');
      } else {
        flagsCount--;
        cell.el.textContent = '';
        cell.el.classList.remove('flagged');
      }
      updateMineDisplay();
    }

    function revealCell(r, c) {
      const cell = grid[r][c];
      if (cell.revealed || cell.flagged) return;

      cell.revealed = true;
      cell.el.classList.add('revealed');
      revealedCount++;

      if (cell.mine) {
        cell.el.textContent = '💣';
        cell.el.classList.add('mine');
        return;
      }

      if (cell.adjacent > 0) {
        cell.el.textContent = cell.adjacent;
        cell.el.classList.add(`c-${cell.adjacent}`);
      } else {
        // Flood fill zeros
        for (let dr = -1; dr <= 1; dr++) {
          for (let dc = -1; dc <= 1; dc++) {
            const nr = r + dr, nc = c + dc;
            if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS) {
              revealCell(nr, nc);
            }
          }
        }
      }
    }

    function gameOver(won) {
      isGameOver = true;
      clearInterval(timerInterval);
      faceBtn.textContent = won ? '😎' : '😵';

      if (!won) {
        // Reveal all mines
        for (let r = 0; r < ROWS; r++) {
          for (let c = 0; c < COLS; c++) {
            if (grid[r][c].mine) {
              grid[r][c].el.textContent = '💣';
              if (!grid[r][c].revealed) grid[r][c].el.classList.add('mine');
            }
          }
        }
      }
    }

    faceBtn.addEventListener('click', initGame);
    initGame();
  </script>
</body>
</html>
