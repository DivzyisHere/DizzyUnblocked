<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Pixel Dino Run</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 12px;
    }
    .hud {
      display: flex;
      justify-content: space-between;
      width: 100%;
      max-width: 540px;
      margin-bottom: 8px;
    }
    .title { font-size: 20px; font-weight: 800; color: #10b981; }
    .score-txt { font-family: monospace; font-size: 16px; color: #94a3b8; }
    .score-txt strong { color: #fff; }
    #wrap {
      position: relative;
      width: 100%;
      max-width: 540px;
      aspect-ratio: 9 / 4;
      border: 2px solid #334155;
      border-radius: 10px;
      overflow: hidden;
      background: #f8fafc;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    canvas { width: 100%; height: 100%; display: block; }
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.85);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      z-index: 10;
    }
    .overlay.active { display: flex; }
    .overlay h2 { font-size: 26px; color: #10b981; }
    button.btn {
      background: #10b981;
      color: #022c22;
      border: none;
      font-weight: 700;
      font-size: 14px;
      padding: 8px 20px;
      border-radius: 6px;
      cursor: pointer;
    }
    .hint { margin-top: 10px; font-size: 12px; color: #64748b; }
  </style>
</head>
<body>
  <div class="hud">
    <div class="title">Pixel Dino Run</div>
    <div class="score-txt">HI <span id="hi">00000</span> <strong id="sc">00000</strong></div>
  </div>

  <div id="wrap">
    <canvas id="c" width="540" height="240"></canvas>
    <div class="overlay" id="ov">
      <h2>Game Over</h2>
      <p id="ov-msg" style="color: #94a3b8; font-size: 14px;">Crash!</p>
      <button class="btn" id="restart">Run Again</button>
    </div>
  </div>
  <div class="hint">Press Space or Up to Jump · Down to Duck · Tap Screen on mobile</div>

  <script>
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    const scEl = document.getElementById('sc');
    const hiEl = document.getElementById('hi');
    const ov = document.getElementById('ov');
    const restartBtn = document.getElementById('restart');

    const GROUND_Y = 190;
    let dino = { x: 45, y: GROUND_Y - 42, w: 36, h: 42, vy: 0, jumping: false, ducking: false };
    let obstacles = [];
    let clouds = [];
    let speed = 5.2;
    let score = 0;
    let hi = parseInt(localStorage.getItem('dino_hi') || '0', 10);
    hiEl.textContent = String(hi).padStart(5, '0');
    let isPlaying = false;
    let frame = 0;

    // Init clouds
    for (let i = 0; i < 4; i++) {
      clouds.push({ x: Math.random() * canvas.width, y: 30 + Math.random() * 60, speed: 0.8 });
    }

    function resetGame() {
      dino = { x: 45, y: GROUND_Y - 42, w: 36, h: 42, vy: 0, jumping: false, ducking: false };
      obstacles = [];
      speed = 5.2;
      score = 0;
      frame = 0;
      isPlaying = true;
      ov.classList.remove('active');
    }

    function jump() {
      if (!isPlaying) { resetGame(); return; }
      if (!dino.jumping) {
        dino.vy = -11.5;
        dino.jumping = true;
      }
    }

    function duck(isDucking) {
      if (!isPlaying) return;
      dino.ducking = isDucking;
      dino.h = isDucking ? 24 : 42;
      if (!dino.jumping) {
        dino.y = GROUND_Y - dino.h;
      }
    }

    function spawnObstacle() {
      const type = Math.random() > 0.3 ? 'cactus' : 'bird';
      if (type === 'cactus') {
        const height = 30 + Math.random() * 20;
        obstacles.push({
          type: 'cactus',
          x: canvas.width + 20,
          y: GROUND_Y - height,
          w: 20 + Math.random() * 14,
          h: height
        });
      } else {
        obstacles.push({
          type: 'bird',
          x: canvas.width + 20,
          y: GROUND_Y - 40 - Math.random() * 25,
          w: 32,
          h: 20
        });
      }
    }

    function update() {
      if (!isPlaying) return;
      frame++;
      score += 0.2;
      const currentScore = Math.floor(score);
      scEl.textContent = String(currentScore).padStart(5, '0');

      if (currentScore > hi) {
        hi = currentScore;
        localStorage.setItem('dino_hi', hi);
        hiEl.textContent = String(hi).padStart(5, '0');
      }

      // Accelerate
      if (frame % 300 === 0 && speed < 12) speed += 0.4;

      // Dino physics
      dino.vy += 0.65;
      dino.y += dino.vy;
      if (dino.y >= GROUND_Y - dino.h) {
        dino.y = GROUND_Y - dino.h;
        dino.vy = 0;
        dino.jumping = false;
      }

      // Clouds
      clouds.forEach(c => {
        c.x -= c.speed;
        if (c.x < -60) c.x = canvas.width + 30;
      });

      // Spawn obstacle
      if (frame % Math.floor(130 - speed * 4) === 0) {
        spawnObstacle();
      }

      // Obstacle loop
      for (let i = 0; i < obstacles.length; i++) {
        const ob = obstacles[i];
        ob.x -= speed;

        // Collision check
        const padding = 6;
        if (dino.x + padding < ob.x + ob.w &&
            dino.x + dino.w - padding > ob.x &&
            dino.y + padding < ob.y + ob.h &&
            dino.y + dino.h > ob.y) {
          gameOver();
          return;
        }
      }
      obstacles = obstacles.filter(ob => ob.x + ob.w > -30);
    }

    function gameOver() {
      isPlaying = false;
      document.getElementById('ov-msg').textContent = `Distance: ${Math.floor(score)}m`;
      ov.classList.add('active');
    }

    function draw() {
      ctx.fillStyle = '#f8fafc';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Clouds
      ctx.fillStyle = '#cbd5e1';
      clouds.forEach(c => {
        ctx.beginPath();
        ctx.arc(c.x, c.y, 14, 0, Math.PI * 2);
        ctx.arc(c.x + 16, c.y - 4, 18, 0, Math.PI * 2);
        ctx.arc(c.x + 34, c.y, 14, 0, Math.PI * 2);
        ctx.fill();
      });

      // Ground Line
      ctx.strokeStyle = '#64748b';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0, GROUND_Y);
      ctx.lineTo(canvas.width, GROUND_Y);
      ctx.stroke();

      // Ground details
      ctx.fillStyle = '#94a3b8';
      for (let x = (frame * speed) % 50; x < canvas.width; x += 50) {
        ctx.fillRect(canvas.width - x, GROUND_Y + 5, 8, 2);
      }

      // Draw Dino
      ctx.fillStyle = '#334155';
      ctx.beginPath();
      ctx.roundRect(dino.x, dino.y, dino.w, dino.h, 4);
      ctx.fill();

      // Dino Eye & crest
      ctx.fillStyle = '#f8fafc';
      ctx.fillRect(dino.x + dino.w - 10, dino.y + 6, 4, 4);

      // Dino legs
      if (!dino.jumping && isPlaying) {
        ctx.fillStyle = '#1e293b';
        const legSwing = Math.sin(frame * 0.4) * 4;
        ctx.fillRect(dino.x + 8, dino.y + dino.h, 6, 6 + legSwing);
        ctx.fillRect(dino.x + 22, dino.y + dino.h, 6, 6 - legSwing);
      }

      // Draw Obstacles
      obstacles.forEach(ob => {
        if (ob.type === 'cactus') {
          ctx.fillStyle = '#15803d';
          ctx.beginPath();
          ctx.roundRect(ob.x, ob.y, ob.w, ob.h, 4);
          ctx.fill();
        } else {
          ctx.fillStyle = '#b91c1c';
          ctx.beginPath();
          ctx.ellipse(ob.x + ob.w/2, ob.y + ob.h/2, ob.w/2, ob.h/2, 0, 0, Math.PI * 2);
          ctx.fill();
        }
      });
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    window.addEventListener('keydown', (e) => {
      if (['Space', 'ArrowUp', 'KeyW'].includes(e.code)) {
        e.preventDefault();
        jump();
      } else if (['ArrowDown', 'KeyS'].includes(e.code)) {
        e.preventDefault();
        duck(true);
      }
    });

    window.addEventListener('keyup', (e) => {
      if (['ArrowDown', 'KeyS'].includes(e.code)) {
        duck(false);
      }
    });

    canvas.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      jump();
    });

    restartBtn.addEventListener('click', resetGame);
    resetGame();
    requestAnimationFrame(loop);
  </script>
</body>
</html>
