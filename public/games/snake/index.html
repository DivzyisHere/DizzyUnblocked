<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Retro Snake</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #090d16;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 12px;
    }
    .hud {
      width: 100%;
      max-width: 440px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .brand h1 {
      font-size: 26px;
      font-weight: 800;
      color: #10b981;
      letter-spacing: -0.02em;
    }
    .stats {
      display: flex;
      gap: 12px;
    }
    .stat-pill {
      background: #1e293b;
      border: 1px solid #334155;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 13px;
      color: #94a3b8;
    }
    .stat-pill strong { color: #fff; margin-left: 4px; }
    #canvas-wrap {
      position: relative;
      width: 100%;
      max-width: 440px;
      aspect-ratio: 1 / 1;
      border-radius: 12px;
      overflow: hidden;
      border: 2px solid #334155;
      background: #0f172a;
      box-shadow: 0 10px 25px -5px rgba(0,0,0,0.5);
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.88);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      z-index: 10;
    }
    .overlay.active { display: flex; }
    .overlay h2 { font-size: 28px; color: #10b981; }
    .overlay p { font-size: 14px; color: #94a3b8; }
    button.btn {
      background: #10b981;
      color: #022c22;
      border: none;
      font-weight: 700;
      font-size: 14px;
      padding: 10px 22px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    button.btn:hover { background: #059669; }
    .controls-hint {
      margin-top: 12px;
      font-size: 12px;
      color: #64748b;
    }
    .dpad {
      display: none;
      grid-template-columns: repeat(3, 50px);
      grid-template-rows: repeat(3, 50px);
      gap: 6px;
      margin-top: 12px;
    }
    @media (hover: none) and (pointer: coarse) {
      .dpad { display: grid; }
    }
    .dpad-btn {
      background: #1e293b;
      border: 1px solid #334155;
      color: #f8fafc;
      font-size: 18px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .dpad-btn:active { background: #334155; }
    .d-up { grid-column: 2; grid-row: 1; }
    .d-left { grid-column: 1; grid-row: 2; }
    .d-right { grid-column: 3; grid-row: 2; }
    .d-down { grid-column: 2; grid-row: 3; }
  </style>
</head>
<body>
  <div class="hud">
    <div class="brand">
      <h1>Retro Snake</h1>
    </div>
    <div class="stats">
      <div class="stat-pill">Score: <strong id="score">0</strong></div>
      <div class="stat-pill">Best: <strong id="best">0</strong></div>
    </div>
  </div>

  <div id="canvas-wrap">
    <canvas id="game-canvas" width="400" height="400"></canvas>
    <div class="overlay" id="game-overlay">
      <h2 id="over-title">Game Over</h2>
      <p id="over-sub">You hit the wall!</p>
      <button class="btn" id="start-btn">Play Again</button>
    </div>
  </div>

  <div class="dpad">
    <button class="dpad-btn d-up" onclick="setDir(0, -1)">▲</button>
    <button class="dpad-btn d-left" onclick="setDir(-1, 0)">◀</button>
    <button class="dpad-btn d-right" onclick="setDir(1, 0)">▶</button>
    <button class="dpad-btn d-down" onclick="setDir(0, 1)">▼</button>
  </div>

  <div class="controls-hint">Use Arrow Keys or W/A/S/D to steer</div>

  <script>
    const canvas = document.getElementById('game-canvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const bestEl = document.getElementById('best');
    const overlay = document.getElementById('game-overlay');
    const overTitle = document.getElementById('over-title');
    const startBtn = document.getElementById('start-btn');

    const GRID = 20;
    const TILES = 20; // 400 / 20 = 20x20
    let snake = [{x: 10, y: 10}, {x: 10, y: 11}, {x: 10, y: 12}];
    let dir = {x: 0, y: -1};
    let nextDir = {x: 0, y: -1};
    let food = {x: 5, y: 5};
    let score = 0;
    let best = parseInt(localStorage.getItem('snake_best') || '0', 10);
    bestEl.textContent = best;
    let isRunning = false;
    let gameLoop = null;
    let particles = [];

    function spawnFood() {
      while (true) {
        const x = Math.floor(Math.random() * TILES);
        const y = Math.floor(Math.random() * TILES);
        const inSnake = snake.some(s => s.x === x && s.y === y);
        if (!inSnake) {
          food = {x, y};
          break;
        }
      }
    }

    function createExplosion(x, y, color) {
      for (let i = 0; i < 12; i++) {
        particles.push({
          x: x * GRID + GRID/2,
          y: y * GRID + GRID/2,
          vx: (Math.random() - 0.5) * 5,
          vy: (Math.random() - 0.5) * 5,
          life: 1.0,
          color: color
        });
      }
    }

    function step() {
      if (!isRunning) return;

      dir = nextDir;
      const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

      // Wall collision
      if (head.x < 0 || head.x >= TILES || head.y < 0 || head.y >= TILES) {
        gameOver("You crashed into the border!");
        return;
      }

      // Self collision
      if (snake.some(s => s.x === head.x && s.y === head.y)) {
        gameOver("You bit yourself!");
        return;
      }

      snake.unshift(head);

      // Check food
      if (head.x === food.x && head.y === food.y) {
        score += 10;
        scoreEl.textContent = score;
        if (score > best) {
          best = score;
          localStorage.setItem('snake_best', best);
          bestEl.textContent = best;
        }
        createExplosion(food.x, food.y, '#10b981');
        spawnFood();
      } else {
        snake.pop();
      }

      render();
    }

    function render() {
      // Background grid
      ctx.fillStyle = '#0b1120';
      ctx.fillRect(0, 0, 400, 400);

      // Subtle grid dots
      ctx.fillStyle = '#1e293b';
      for (let x = 0; x < TILES; x++) {
        for (let y = 0; y < TILES; y++) {
          ctx.fillRect(x * GRID + 9, y * GRID + 9, 2, 2);
        }
      }

      // Render Food with glow
      ctx.save();
      ctx.fillStyle = '#ef4444';
      ctx.shadowColor = '#ef4444';
      ctx.shadowBlur = 10;
      ctx.beginPath();
      ctx.arc(food.x * GRID + GRID/2, food.y * GRID + GRID/2, GRID/2 - 2, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      // Render Snake
      snake.forEach((seg, i) => {
        ctx.fillStyle = i === 0 ? '#34d399' : '#10b981';
        ctx.fillRect(seg.x * GRID + 1, seg.y * GRID + 1, GRID - 2, GRID - 2);
      });

      // Update & render particles
      particles = particles.filter(p => p.life > 0);
      particles.forEach(p => {
        p.x += p.vx;
        p.y += p.vy;
        p.life -= 0.04;
        ctx.fillStyle = p.color;
        ctx.globalAlpha = Math.max(0, p.life);
        ctx.fillRect(p.x, p.y, 3, 3);
      });
      ctx.globalAlpha = 1.0;
    }

    function gameOver(reason) {
      isRunning = false;
      clearInterval(gameLoop);
      overTitle.textContent = "Game Over";
      document.getElementById('over-sub').textContent = reason + ` Final Score: ${score}`;
      overlay.classList.add('active');
    }

    function startGame() {
      snake = [{x: 10, y: 10}, {x: 10, y: 11}, {x: 10, y: 12}];
      dir = {x: 0, y: -1};
      nextDir = {x: 0, y: -1};
      score = 0;
      scoreEl.textContent = score;
      spawnFood();
      overlay.classList.remove('active');
      isRunning = true;
      if (gameLoop) clearInterval(gameLoop);
      gameLoop = setInterval(step, 110);
      render();
    }

    function setDir(dx, dy) {
      if (dir.x + dx === 0 && dir.y + dy === 0) return; // Disallow immediate reverse
      nextDir = { x: dx, y: dy };
    }

    window.addEventListener('keydown', (e) => {
      if (['ArrowUp', 'KeyW'].includes(e.code)) { e.preventDefault(); setDir(0, -1); }
      else if (['ArrowDown', 'KeyS'].includes(e.code)) { e.preventDefault(); setDir(0, 1); }
      else if (['ArrowLeft', 'KeyA'].includes(e.code)) { e.preventDefault(); setDir(-1, 0); }
      else if (['ArrowRight', 'KeyD'].includes(e.code)) { e.preventDefault(); setDir(1, 0); }
      else if (e.code === 'Space' && !isRunning) { startGame(); }
    });

    startBtn.addEventListener('click', startGame);
    startGame();
  </script>
</body>
</html>
